name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand initial source archive
        if: hashFiles('source.tar.xz.base64') != ''
        shell: bash
        run: |
          base64 --decode source.tar.xz.base64 > /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz
          rm source.tar.xz.base64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'Import DriveDashboard Android source code' && git push origin HEAD:main)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DriveDashboard-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
