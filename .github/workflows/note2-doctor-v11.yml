name: Build Note2 Doctor v1.1
on:
  workflow_dispatch:
  push:
    branches: [note2-doctor-v11]
    paths:
      - 'note2doctor/source.zip'
      - '.github/workflows/note2-doctor-v11.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: note2-doctor-v11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Note 2 Doctor sources
        run: |
          mkdir -p note2doctor/workspace
          unzip -q note2doctor/source.zip -d note2doctor/workspace
      - name: Compile Android 7 APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd note2doctor/workspace
          gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Note2Doctor-v1.1-Android7-debug
          path: note2doctor/workspace/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to this isolated branch
        shell: bash
        run: |
          mkdir -p note2doctor/dist
          cp note2doctor/workspace/app/build/outputs/apk/debug/app-debug.apk note2doctor/dist/Note2Doctor-v1.1-Android7-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add note2doctor/dist/Note2Doctor-v1.1-Android7-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Build Note 2 Doctor v1.1 debug APK'
            git push origin HEAD:note2-doctor-v11
          fi