name: Edge Sidebar LSPosed APK
on:
  push:
    branches: [edge-sidebar-lsposed-v1]
    paths:
      - 'sidebar/**'
      - '.github/workflows/edge-sidebar-lsposed.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build LSPosed module APK
        run: cd sidebar && gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeSidebar-LSPosed-2.0-APK
          path: sidebar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
