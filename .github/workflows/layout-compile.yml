name: Check Figma Layout Kotlin
on:
  push:
    branches: [figma-1to1-layout]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "SDK location: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch MiSans Latin from Xiaomi
        shell: bash
        run: |
          set -euo pipefail
          # Xiaomi permits application embedding, but font files must not be
          # redistributed separately in this public source repository.
          curl --fail --location --retry 3 --silent --show-error \
            'https://hyperos.mi.com/font-download/MiSans_Latin.zip' -o /tmp/misans-latin.zip
          mkdir -p /tmp/misans-latin app/src/main/res/font
          unzip -q /tmp/misans-latin.zip -d /tmp/misans-latin
          for weight in Thin ExtraLight Light Regular Normal Medium Semibold Demibold Bold Heavy; do
            font="$(find /tmp/misans-latin -type f -iname "MiSansLatin-${weight}.ttf" -print -quit)"
            test -n "$font" || { echo "Missing MiSansLatin-${weight}.ttf" >&2; exit 1; }
            lower="$(echo "$weight" | tr '[:upper:]' '[:lower:]')"
            cp "$font" "app/src/main/res/font/misans_latin_${lower}.ttf"
          done
      - name: Compile Kotlin UI without packaging APK
        run: gradle --no-daemon :app:compileDebugKotlin
