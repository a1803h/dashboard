name: Edge Sidebar LSPosed 2.5 APK
on:
  push:
    branches: [edge-sidebar-v25-inactivity-lastback]
    paths:
      - 'sidebar/**'
      - '.github/workflows/edge-sidebar-v25.yml'
  workflow_dispatch:
concurrency:
  group: sidebar-v25-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        run: cd sidebar && gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeSidebar-LSPosed-2.5-APK
          path: sidebar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
