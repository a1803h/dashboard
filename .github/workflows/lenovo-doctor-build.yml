name: Build Lenovo Doctor 2.0 APK
on:
  push:
    branches: [lenovo-doctor-build]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Lenovo Doctor sources
        run: mkdir source && unzip -q LenovoDoctor-build-source.zip -d source
      - name: Build debug APK
        run: gradle -p source --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LenovoDoctor-v2.0-debug
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
